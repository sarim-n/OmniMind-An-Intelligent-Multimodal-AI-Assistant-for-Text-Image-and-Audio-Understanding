[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-ai-assistant"
version = "0.1.0"
description = "Intelligent Multimodal AI Assistant Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "python-multipart>=0.0.18",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "filetype>=1.2.0",
    "email-validator>=2.0.0",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "torch>=2.4.0",
    "faster-whisper>=1.1.0",
    "opencv-python-headless>=4.10.0.84",
    "reportlab>=4.2.5",
    "jiwer>=3.0.5",
    "psutil>=6.1.0",
    "langdetect>=1.0.9",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes>=0.44.0",
    "pynvml>=12.0.0",
]
cpu = [
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4",
    "pypdf>=5.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["filetype", "filetype.*", "jose", "jose.*", "passlib", "passlib.*"]
ignore_missing_imports = true
